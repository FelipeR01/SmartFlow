<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" role="img" aria-labelledby="t d"><title id="t">Do reporte ao semáforo</title><desc id="d">Quatro etapas, de cima para baixo: o cidadão reporta onde o trânsito trava; câmeras e reportes mostram a fila; a inteligência artificial sugere o ajuste do tempo do semáforo; a cidade acompanha o resultado e ouve o cidadão.</desc><style>
.p{animation:entrar .6s cubic-bezier(.2,.7,.2,1) both}
.p1{animation-delay:.2s}.p2{animation-delay:.9s}.p3{animation-delay:1.6s}.p4{animation-delay:2.3s}
.seta{stroke-dasharray:1;animation:desenhar .4s ease-out both}
.s1{animation-delay:.7s}.s2{animation-delay:1.4s}.s3{animation-delay:2.1s}
.cx{animation:pulsar 6s ease-in-out 3.2s 4 both}
.c2{animation-delay:4.4s}.c3{animation-delay:5.6s}.c4{animation-delay:6.8s}
.ponto{animation:descer 6s linear 3.2s 4 both}
@keyframes entrar{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes desenhar{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pulsar{0%{fill:#0F1011;stroke:#2E3137}6%,18%{fill:#16181B;stroke:#3DBE86}26%,100%{fill:#0F1011;stroke:#2E3137}}
@keyframes descer{0%{opacity:0;transform:translateY(0)}2%{opacity:1}78%{opacity:1;transform:translateY(420px)}82%,100%{opacity:0;transform:translateY(420px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ponto{display:none}}
</style><g class="p p1"><rect class="cx c1" x="10" y="10" width="340" height="104" rx="14" fill="#0F1011" stroke="#2E3137" stroke-width="2"/><circle cx="46" cy="62" r="18" fill="#2A2D33"/><text x="46" y="69" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#F4F5F7">1</text><text x="78" y="46" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Cidadão</text><text x="78" y="72" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#A3A8B0">Reporta onde o</text><text x="78" y="94" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#A3A8B0">trânsito trava</text></g><path class="seta s1" pathLength="1" d="M180,118 v26 m-8,-8 l8,8 l8,-8" fill="none" stroke="#71717A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="p p2"><rect class="cx c2" x="10" y="150" width="340" height="104" rx="14" fill="#0F1011" stroke="#2E3137" stroke-width="2"/><circle cx="46" cy="202" r="18" fill="#2A2D33"/><text x="46" y="209" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#F4F5F7">2</text><text x="78" y="186" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Fluxo real</text><text x="78" y="212" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#A3A8B0">Câmeras e reportes</text><text x="78" y="234" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#A3A8B0">mostram a fila</text></g><path class="seta s2" pathLength="1" d="M180,258 v26 m-8,-8 l8,8 l8,-8" fill="none" stroke="#71717A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="p p3"><rect class="cx c3" x="10" y="290" width="340" height="104" rx="14" fill="#0F1011" stroke="#2E3137" stroke-width="2"/><circle cx="46" cy="342" r="18" fill="#2A2D33"/><text x="46" y="349" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#F4F5F7">3</text><text x="78" y="326" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">IA</text><text x="78" y="352" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#A3A8B0">Sugere o ajuste do</text><text x="78" y="374" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#A3A8B0">tempo do semáforo</text></g><path class="seta s3" pathLength="1" d="M180,398 v26 m-8,-8 l8,8 l8,-8" fill="none" stroke="#71717A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="p p4"><rect class="cx c4" x="10" y="430" width="340" height="104" rx="14" fill="#0F1011" stroke="#2E3137" stroke-width="2"/><circle cx="46" cy="482" r="18" fill="#2A2D33"/><text x="46" y="489" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#F4F5F7">4</text><text x="78" y="466" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Cidade</text><text x="78" y="492" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#A3A8B0">Acompanha o resultado</text><text x="78" y="514" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#A3A8B0">e ouve o cidadão</text></g><circle class="ponto" cx="180" cy="62" r="6" fill="#3DBE86"/></svg>